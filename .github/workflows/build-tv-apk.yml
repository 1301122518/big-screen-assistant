name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('tv-client/**/*.gradle*', 'tv-client/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: tv-client

    - name: Generate CI signing keystore
      run: |
        keytool -genkeypair -v -keystore tv-client/ci-release.keystore \
          -alias ci-release -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ci123456 -keypass ci123456 \
          -dname "CN=BigScreenTV CI, OU=Dev, O=BigScreenTV, L=Beijing, ST=Beijing, C=CN"

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      working-directory: tv-client

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: big-screen-tv-debug
        path: tv-client/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK (signed)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        ./gradlew assembleRelease --no-daemon \
          -PKEYSTORE_FILE=ci-release.keystore \
          -PKEYSTORE_PASSWORD=ci123456 \
          -PKEY_ALIAS=ci-release \
          -PKEY_PASSWORD=ci123456
      working-directory: tv-client

    - name: Upload Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: big-screen-tv-release
        path: tv-client/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
